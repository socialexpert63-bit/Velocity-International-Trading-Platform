font-size:12px}.mn .lg2 div,.mn .mu{overflow-wrap:anywhere}@keyframes gw{from{width:0}}.adm{display:grid;grid-template-columns:210px 1fr;gap:18px;transition:.3s}.adm.cl{grid-template-columns:62px 1fr}.sb{background:var(--g);border-radius:20px;padding:14px 10px;position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:4px}.sb a,.sb button{color:#cfe0d6;text-decoration:none;padding:10px 12px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap;overflow:hidden}.sb a:hover,.sb button:hover{background:#ffffff1a}.sb a.on{background:var(--l);color:var(--g);font-weight:600}.adm.cl .sb span{display:none}.mn{min-width:0}.ki{display:flex;justify-content:space-between;align-items:center}.ki i{font-style:normal;width:36px;height:36px;border-radius:10px;background:#e8f3d8;display:grid;place-items:center}.tr{font-size:12px;color:#2d8a4e;font-weight:600}.g2{display:grid;gap:14px;grid-template-columns:1fr}.g2.c{grid-template-columns:1fr 1fr}.ch{width:100%;height:auto}.ch circle{transition:r .2s}.ch circle:hover{r:8}.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dw 1.4s .2s forwards}@keyframes dw{to{stroke-dashoffset:0}}.dn{width:150px;flex:none}.lg2{font-size:13px;display:grid;gap:4px}.lg2 s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.seg{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0}.seg i{transition:flex .6s}.fd{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}.fd b{width:28px;height:28px;flex:none;border-radius:8px;background:#e8f3d8;display:grid;place-items:center;font-weight:400}@media(max-width:800px){.adm,.adm.cl{grid-template-columns:1fr}.sb{flex-direction:row;overflow-x:auto;position:static}.g2.c{grid-template-columns:1fr}.sb button{display:none}}

</style></head><body>
<div id="splash"><div class="lg">🐾</div><h1>Velocity <i>International</i> Trading</h1><p>Pet Care Distribution Platform · Concept</p><div class="ld"><i></i></div></div><nav id="nav"></nav><main id="app"></main><div id="toast" role="status"></div>
<script>
const STEPS=["Order placed","Confirmed","Preparing","Packed","Dispatched","In transit","Delivered"];
const CATS=["Dry Food","Wet Food","Treats","Supplements","Grooming","Toys","Hygiene"];
const IC={"Dry Food":"🥣","Wet Food":"🥫","Treats":"🦴","Supplements":"💊","Grooming":"🧴","Toys":"🎾","Hygiene":"🧼"};
const P=[["Adult Dog Kibble","Dry Food",15,42,2,60,20],["Puppy Kibble","Dry Food",10,38,2,18,20],["Cat Dry Mix","Dry Food",8,30,3,120,30],["Chicken Pâté Tins","Wet Food",12,24,4,200,40],["Tuna Pouches","Wet Food",24,18,3,14,25],["Dental Chews","Treats",20,15,5,90,30],["Training Treats","Treats",6,11,5,0,20],["Joint Care Tablets","Supplements",3,55,2,40,15],["Oatmeal Shampoo","Grooming",6,21,3,75,20],["Rope Toy Set","Toys",12,16,4,160,40],["Waste Bags 600ct","Hygiene",10,9,6,22,30],["Litter Crystals","Hygiene",8,19,3,100,30]].map((p,i)=>({id:i,name:p[0],cat:p[1],pack:p[2]+" units/carton",price:p[3],moq:p[4],stock:p[5],res:0,thr:p[6],brand:"Brand placeholder"}));
const seed=()=>({inv:P,orders:[{id:"WO-1001",cust:"Demo Pet Shop A",items:[{id:0,q:4}],step:5},{id:"WO-1002",cust:"Demo Retailer B",items:[{id:3,q:6}],step:1}],log:["Demo data loaded"],cart:{}});
let S;try{S=JSON.parse(localStorage.getItem("vit")||"null")}catch(e){}
S=S&&S.inv?S:seed();S.orders.forEach(o=>{if(!o.rs&&o.step<6){o.items.forEach(i=>S.inv[i.id].res+=i.q);o.rs=1}});
const U={cat:"All",q:"",sel:"WO-1001",lo:0,iq:""};
const save=()=>{try{localStorage.setItem("vit",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const m=n=>"$"+n.toLocaleString();const tot=o=>o.items.reduce((a,i)=>a+i.q*S.inv[i.id].price*S.inv[i.id].moq*0+i.q*S.inv[i.id].price*10,0);
const log=t=>{S.log.unshift(t);S.log=S.log.slice(0,8)};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
const avail=p=>p.stock-p.res;
const art=cat=>{const h=[150,28,200,340,95,45,180][CATS.indexOf(cat)],c=`hsl(${h} 50% 30%)`,d=`hsl(${h} 60% 62%)`,W='#fff';const s={"Dry Food":`<path d="M33 14h34l6 8v46a4 4 0 0 1-4 4H31a4 4 0 0 1-4-4V22z" fill="${c}"/><rect x="32" y="34" width="36" height="26" rx="6" fill="${W}"/><circle cx="50" cy="46" r="7" fill="${d}"/><circle cx="41" cy="39" r="2.5" fill="${d}"/><circle cx="59" cy="39" r="2.5" fill="${d}"/>`,"Wet Food":`<ellipse cx="50" cy="26" rx="22" ry="6" fill="#cfd4d6"/><path d="M28 26v36c0 4 10 7 22 7s22-3 22-7V26c0 4-10 7-22 7s-22-3-22-7z" fill="${c}"/><rect x="28" y="38" width="44" height="18" fill="${W}"/><circle cx="50" cy="47" r="5" fill="${d}"/>`,"Treats":`<path d="M30 16h40l-4 54H34z" fill="${c}"/><rect x="30" y="14" width="40" height="6" rx="2" fill="${d}"/><path d="M38 44a4 4 0 1 1 3-6l18 0a4 4 0 1 1 3 6a4 4 0 1 1-3 6l-18 0a4 4 0 1 1-3-6z" fill="${W}"/>`,"Supplements":`<rect x="36" y="12" width="28" height="12" rx="3" fill="${d}"/><rect x="32" y="22" width="36" height="50" rx="7" fill="${c}"/><rect x="32" y="36" width="36" height="22" fill="${W}"/><rect x="44" y="42" width="12" height="10" rx="5" fill="${d}"/>`,"Grooming":`<rect x="44" y="8" width="18" height="5" rx="2" fill="${d}"/><rect x="47" y="12" width="6" height="10" fill="${c}"/><rect x="32" y="22" width="36" height="52" rx="9" fill="${c}"/><rect x="32" y="38" width="36" height="20" fill="${W}"/><circle cx="50" cy="48" r="6" fill="${d}"/>`,"Toys":`<circle cx="38" cy="46" r="20" fill="${d}"/><path d="M20 46a18 10 0 0 0 36 0" stroke="${W}" stroke-width="3" fill="none"/><path d="M52 62l22-24" stroke="${c}" stroke-width="7" stroke-linecap="round"/><circle cx="76" cy="36" r="6" fill="${c}"/>`,"Hygiene":`<rect x="24" y="26" width="52" height="44" rx="8" fill="${c}"/><rect x="24" y="40" width="52" height="18" fill="${W}"/><path d="M40 49h20" stroke="${d}" stroke-width="4" stroke-linecap="round"/><rect x="34" y="16" width="32" height="12" rx="4" fill="${d}"/>`};return`<svg viewBox="0 0 100 80" role="img" aria-label="${cat} illustration"><ellipse cx="50" cy="74" rx="28" ry="3" fill="#0002"/>${s[cat]}</svg>`};
const stat=p=>avail(p)<=0?'<span class="b r">Out of stock</span>':avail(p)<=p.thr?'<span class="b w">Low stock</span>':'<span class="b">In stock</span>';
const ROUTES={home:"Home",shop:"Buyer Portal",orders:"Orders",inventory:"Inventory",shipments:"Shipments",admin:"Admin"};
function nav(r){$("#nav").innerHTML='<b>Velocity <i>●</i> Concept</b>'+Object.entries(ROUTES).map(([k,v])=>`<a href="#${k}" class="${k==r?"on":""}">${v}${k=="shop"&&Object.keys(S.cart).length?` (${Object.keys(S.cart).length})`:""}</a>`).join("")}
const V={
home:()=>`<section class="hero"><h1>Smarter Distribution. Stronger Pet Care Supply Chains.</h1><p>A connected approach to wholesale ordering, product distribution and supply chain visibility.</p><div class="row"><a class="btn" href="#shop">Explore Our Platform</a><a class="btn s" style="color:#fff;border-color:#ffffff66" href="#admin">View Admin Dashboard</a></div></section>
<h2>Product categories</h2><div class="grid">${CATS.map((c,i)=>`<a class="card" style="text-decoration:none;color:inherit;animation-delay:${i*60}ms" href="#shop" data-a="cat" data-v="${c}"><div class="ic">${art(c)}</div><b>${c}</b></a>`).join("")}</div>
<h2>How it works</h2><div class="grid">${["Product Sourcing","Warehouse Management","Wholesale Ordering","Order Fulfilment"].map((t,i)=>`<div class="card" style="animation-delay:${i*100}ms"><div class="kp">0${i+1}</div><b>${t}</b></div>`).join("")}</div>
<h2>Try the connected demo</h2><div class="card"><p>Place a bulk order in the Buyer Portal, then watch Orders, Inventory, Shipments and Admin update together.</p><a class="btn" href="#shop">Become a Wholesale Partner (demo)</a></div>

V.inventory=()=>{const I=S.inv,low=I.filter(p=>avail(p)>0&&avail(p)<=p.thr),out=I.filter(p=>avail(p)<=0),inc=I.filter(p=>p.inc),rc=I.filter(p=>avail(p)<=p.thr&&!p.inc),K=[['Total SKUs',I.length],['Available units',I.reduce((a,p)=>a+Math.max(0,avail(p)),0)],['Low stock',low.length],['Out of stock',out.length],['Incoming cartons',inc.reduce((a,p)=>a+p.inc,0)]],p=U.pd!=null&&I[U.pd],wt=WH.map((w,i)=>I.filter(x=>x.id%3==i).reduce((a,x)=>a+x.stock,0)),mw=Math.max(...wt,1),al=(ic,t,b)=>`<div class='al'><span>${ic} ${t}</span>${b||''}</div>`;return`<div class='row' style='justify-content:space-between'><h2 style='margin:0'>Inventory</h2><button class='btn sm s' data-a='exp'>Export CSV</button></div><div class='grid' style='margin:14px 0'>${K.map((k,i)=>`<div class='card' style='animation-delay:${i*60}ms'><div class='mu'>${k[0]}</div><div class='kp' data-n='${k[1]}'>0</div></div>`).join('')}</div><div class='lay' style='margin-bottom:16px'><div class='card'><b>Stock alerts</b>${out.map(x=>al('🔴',x.name+' out of stock')).join('')}${low.map(x=>al('🟠',x.name+' low ('+avail(x)+')')).join('')}${rc.map(x=>al('🔁','Reorder recommended: '+x.name,`<button class='btn sm' data-a='ro' data-v='${x.id}'>Reorder</button>`)).join('')}${inc.map(x=>al('🚚','Incoming: '+x.name+' (+'+x.inc+')',`<button class='btn sm s' data-a='rc' data-v='${x.id}'>Receive</button>`)).join('')}${out.length+low.length+inc.length?'':al('✅','All stock healthy')}</div><div class='card'><b>Warehouse stock</b> <span class='mu'>(demo)</span>${WH.map((w,i)=>`<div class='mu' style='margin-top:8px'>${w} · ${wt[i]}</div><div class='bar'><i style='width:${wt[i]/mw*100}%'></i></div>`).join('')}</div></div><div class='fl'><input id='iq' placeholder='Search SKU or product…' value='${U.iq||''}'><select data-g='ic' aria-label='Category'><option value=''>All categories</option>${CATS.map(c=>`<option ${U.ic==c?'selected':''}>${c}</option>`).join('')}</select><label style='display:flex;flex-direction:row;gap:6px;align-items:center'><input type='checkbox' id='lo' ${U.lo?'checked':''}> Low stock only</label></div><div class='tw' id='it'>${inv()}</div>${p?`<div class='mo r'><aside class='dw'><div class='row' style='justify-content:space-between'><h3 style='margin:0'>${p.name}</h3><button class='btn sm s' data-a='cl2'>Close</button></div><div class='ic' style='height:170px;margin-top:10px'>${pk(p)}</div><div class='mu'>SKU-${100+p.id} · ${p.cat} · ${BR(p)}</div><p>${stat(p)} <b>${avail(p)}</b> available · ${p.res} reserved · reorder at ${p.thr}</p><b>Warehouse allocation</b>${WH.map((w,i)=>`<div class='al'><span>${w}</span><b>${Math.round(p.stock*(i==p.id%3?.7:.15))}</b></div>`).join('')}<br><b>Stock movement history</b>${S.mv.filter(x=>x.id==p.id).slice(0,6).map(x=>`<div class='al'>${x.t}</div>`).join('')||"<p class='mu'>No movements yet. Adjust stock to create one.</p>"}<div class='row' style='margin-top:12px'><button class='btn' data-a='ia' data-v='${p.id}' data-d='10'>+10</button><button class='btn s' data-a='ia' data-v='${p.id}' data-d='-10'>−10</button></div></aside></div>`:''}`};
V.shipments=()=>{const o=S.orders.find(x=>x.id==U.sel)||S.orders[0],pv=U.ps[o.id]??o.step,a=PTS[pv],b=PTS[o.step];U.ps[o.id]=o.step;const rt=PTS.map(p=>p.join(',')).join(' ');return`<h2 style='margin-top:0'>Shipment tracking</h2><div class='lay'><div class='card'><div class='row' style='justify-content:space-between'><div><b>${o.id}</b> · ${o.cust}<div class='mu'>Ref: ${o.ref||'Not assigned'} · ETA: placeholder · ${m(tot(o))}</div></div>${bd(o)}</div><svg viewBox='0 0 640 190' class='ch' role='img' aria-label='Illustrative route map'><rect width='640' height='190' rx='14' fill='#e8f3d8' opacity='.5'/><polyline points='${rt}' fill='none' stroke='var(--g2)' stroke-opacity='.3' stroke-width='4' stroke-dasharray='6 8' stroke-linejoin='round'/><polyline points='${PTS.slice(0,o.step+1).map(p=>p.join(',')).join(' ')}' fill='none' stroke='var(--g2)' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/><circle cx='40' cy='150' r='9' fill='var(--g)'/><text x='40' y='176' text-anchor='middle' font-size='11' fill='var(--tx)'>Warehouse (demo)</text><circle cx='590' cy='60' r='9' fill='var(--l)' stroke='var(--g)' stroke-width='3'/><text x='590' y='88' text-anchor='middle' font-size='11' fill='var(--tx)'>Retailer (demo)</text><g id='tk' data-to='translate(${b[0]}px,${b[1]}px)' style='transform:translate(${a[0]}px,${a[1]}px);transition:transform 1.1s ease'><text font-size='24' x='-12' y='-8'>🚚</text></g></svg><div class='bar' style='margin:8px 0'><i style='width:${o.step/6*100}%'></i></div><div class='tl'>${STEPS.map((s,i)=>`<div class='st ${i<=o.step?'d':''} ${i==o.step?'c':''}'><i>${i<=o.step?'✓':i+1}</i>${s}<small>${(o.t&&o.t[i])||(i<=o.step?'Demo':'—')}</small></div>`).join('')}</div><div class='row'><button class='btn s' data-a='sb' data-v='${o.id}' ${o.step<1?'disabled':''}>‹ Back</button><button class='btn' data-a='sa' data-v='${o.id}' ${o.step>5?'disabled':''}>Advance status ›</button><button class='btn s' data-a='ref' data-v='${o.id}'>Assign delivery ref</button></div><p class='mu'>Illustrative simulation only. No live GPS.</p></div><div style='display:grid;gap:10px;align-content:start'><b>All shipments</b>${S.orders.slice().reverse().map(x=>`<button class='card sc ${x.id==o.id?'sel':''}' data-a='ss' data-v='${x.id}'><div style='flex:1'><b>${x.id}</b> <span class='mu'>${x.cust}</span><div class='bar' style='margin-top:6px'><i style='width:${x.step/6*100}%'></i></div></div>${bd(x)}</button>`).join('')}</div></div>`};
document.addEventListener('input',e=>{const g=e.target.dataset.g;if(!g)return;U[g]=e.target.value;if(g=='oq'&&$('#ot'))$('#ot').innerHTML=orr();if(g=='ic'&&$('#it'))$('#it').innerHTML=inv()});
document.addEventListener('click',e=>{if(e.target.classList.contains('mo')){U.od=U.pd=null;return render()}const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,O=()=>S.orders.find(x=>x.id==v),P=()=>S.inv[+v],stp=(o,n)=>{setStep(o,n);o.t=o.t||[];o.t[n]=nowT()};if(a=='of'){U.of=v;render()}if(a=='od'){U.od=v;render()}if(a=='cl2'){U.od=U.pd=null;render()}if(a=='cf'){stp(O(),1);toast('Order confirmed');render()}if(a=='ref'){const o=O();o.ref='VIT-'+(1000+Math.floor(Math.random()*9000));log('Delivery ref '+o.ref+' assigned to '+o.id);toast('Ref '+o.ref);render()}if(a=='ia'){const p=P(),d=+t.dataset.d;p.stock=Math.max(0,p.stock+d);p.u=nowT();S.mv.unshift({id:p.id,t:(d>0?'+':'')+d+' manual adjustment · '+nowT()});log('Inventory updated: '+p.name+' → '+p.stock);render()}if(a=='ro'){const p=P();p.inc=p.thr*2;log('Purchase order drafted: '+p.name);toast('Reorder placed (demo)');render()}if(a=='rc'){const p=P();p.stock+=p.inc;S.mv.unshift({id:p.id,t:'+'+p.inc+' received · '+nowT()});log('Stock received: '+p.name+' +'+p.inc);p.inc=0;p.u=nowT();toast('Stock received');render()}if(a=='pd'){U.pd=+v;render()}if(a=='exp'){const c='SKU,Name,Warehouse,Available,Reserved\n'+S.inv.map(p=>`SKU-${100+p.id},${p.name},${wh(p)},${avail(p)},${p.res}`).join('\n');try{navigator.clipboard.writeText(c);toast('Inventory report copied as CSV')}catch(x){toast('Report prepared (demo)')}}if(a=='ss'){U.sel=v;render()}if(a=='sa'||a=='sb'){const o=O(),n=o.step+(a=='sa'?1:-1);if(n<0||n>6)return;stp(o,n);toast(STEPS[n]);render()}});
function setStep(o,n){const was=o.step;if(was<6&&n>=6)o.items.forEach(i=>{S.inv[i.id].stock-=i.q;S.inv[i.id].res-=i.q});if(was>=6&&n<6)o.items.forEach(i=>{S.inv[i.id].stock+=i.q;S.inv[i.id].res+=i.q});o.step=n;log(`${o.id}: ${STEPS[n]}`)}
function count(){$$("[data-n]").forEach(e=>{const t=+e.dataset.n;let s=null;const f=ts=>{s=s||ts;const p=Math.min((ts-s)/700,1);e.textContent=Math.round(t*p).toLocaleString();if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function render(){const r=location.hash.slice(1);const k=V[r]?r:"home";nav(k);$("#app").innerHTML=V[k]();count();save();rv()}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
document.addEventListener("input",e=>{if(e.target.id=="q"){U.q=e.target.value;$("#grid").innerHTML=grid()}if(e.target.id=="iq"){U.iq=e.target.value;$("#it").innerHTML=inv()}});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(t.id=="lo"){U.lo=t.checked;$("#it").innerHTML=inv()}if(a=="set"){const o=S.orders.find(x=>x.id==t.dataset.v);setStep(o,+t.value);toast("Status updated");render()}if(a=="sel2"){U.sel=t.value;render()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName=="SELECT")return;const a=t.dataset.a,v=t.dataset.v,c=S.cart;
if(a=="cat"){U.cat=v;if(location.hash=="#shop")render()}
if(a=="add"){const p=S.inv[v];c[v]=c[v]?c[v]+1:p.moq;toast(p.name+" added");nav("shop");$("#cart").innerHTML=cart()}
if(a=="inc"||a=="dec"){const p=S.inv[v];c[v]+=a=="inc"?1:-1;if(c[v]<p.moq)delete c[v];nav("shop");$("#cart").innerHTML=cart()}
if(a=="place"){const n=($("#cust").value||"").trim();if(!n){$("#cust").style.borderColor="var(--bad)";toast("Enter a business name");return}
const o={id:"WO-"+(1001+S.orders.length),cust:n,items:Object.entries(c).map(([id,q])=>({id:+id,q})),step:0,rs:1};o.items.forEach(i=>S.inv[i.id].res+=i.q);S.orders.push(o);U.sel=o.id;log(`New order ${o.id} from ${n}`);S.cart={};toast("Order "+o.id+" submitted ✓");location.hash="#orders";render()}
if(a=="sel"){U.sel=v}
if(a=="adv"){const o=S.orders.find(x=>x.id==v);setStep(o,o.step+1);toast(STEPS[o.step]);render()}
if(a=="adj"){const p=S.inv[v];p.stock=Math.max(0,p.stock+ +t.dataset.d);log(`Inventory updated: ${p.name} → ${p.stock}`);$("#it").innerHTML=inv();save()}
if(a=="csv"){const r="SKU,Name,Stock,Reserved\n"+S.inv.map(p=>`SKU-${100+p.id},${p.name},${p.stock},${p.res}`).join("\n");toast(r.split("\n").length-1+" rows prepared (demo export)")}
if(a=="reset"){S=seed();S.orders.forEach(o=>{o.items.forEach(i=>S.inv[i.id].res+=i.q);o.rs=1});render()}});
render();
setTimeout(()=>{$("#splash").classList.add("off")},1900);
</script></body></html>
